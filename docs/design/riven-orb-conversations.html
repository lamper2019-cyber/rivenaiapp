<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIVEN — conversations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF7F2;--charcoal:#161513;--gold:#C9A961;--gold-soft:#E3C988;
    --line:rgba(250,247,242,0.10);--muted:rgba(250,247,242,0.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{min-height:100vh;background:#0c0b0a;display:flex;flex-direction:column;align-items:center;gap:18px;font-family:'Inter',system-ui,sans-serif;padding:22px 12px 40px;}

  /* scenario tabs */
  .tabs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;font-size:12.5px;color:var(--muted);background:rgba(250,247,242,0.05);border:1px solid var(--line);padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.2s;}
  .tab:hover{color:var(--cream);}
  .tab.active{color:var(--charcoal);background:linear-gradient(180deg,var(--gold-soft),var(--gold));border-color:transparent;font-weight:600;}

  .phone{
    width:100%;max-width:380px;height:760px;max-height:84vh;
    background:radial-gradient(120% 90% at 50% 8%, #211e1a 0%, var(--charcoal) 55%, #100f0d 100%);
    border-radius:42px;border:1px solid rgba(250,247,242,0.06);
    box-shadow:0 40px 120px rgba(0,0,0,0.6), inset 0 0 0 8px #050505;
    position:relative;overflow:hidden;display:flex;flex-direction:column;padding:50px 18px 22px;
  }
  .notch{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#050505;border-radius:0 0 16px 16px;}

  .head{display:flex;align-items:center;gap:12px;padding:0 4px 14px;border-bottom:1px solid var(--line);}
  .orb-mini{width:40px;height:40px;border-radius:50%;flex:0 0 auto;position:relative;
    background:radial-gradient(circle at 36% 32%, #fff5df 0%, var(--gold-soft) 24%, var(--gold) 56%, #8c6f37 86%);
    box-shadow:0 0 18px rgba(201,169,97,0.5), inset -3px -4px 9px rgba(70,52,18,0.6), inset 3px 3px 7px rgba(255,245,220,0.5);
    animation:breathe 5s ease-in-out infinite;}
  .head .who{font-family:'Fraunces',serif;font-weight:600;letter-spacing:.22em;color:var(--cream);font-size:14px;}
  .head .ctx{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}

  .thread{flex:1;overflow-y:auto;padding:16px 4px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;}
  .thread::-webkit-scrollbar{display:none;}

  .msg{display:flex;gap:8px;max-width:86%;animation:rise .45s ease both;}
  .msg.riven{align-self:flex-start;}
  .msg.you{align-self:flex-end;flex-direction:row-reverse;}
  .dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;margin-top:4px;
    background:radial-gradient(circle at 36% 32%, #fff5df, var(--gold) 70%);box-shadow:0 0 10px rgba(201,169,97,0.4);}
  .bubble{padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;}
  .riven .bubble{background:rgba(201,169,97,0.12);border:1px solid rgba(201,169,97,0.18);color:var(--cream);font-family:'Fraunces',serif;font-weight:400;border-bottom-left-radius:5px;}
  .riven .bubble .accent{color:var(--gold-soft);}
  .you .bubble{background:rgba(250,247,242,0.08);color:var(--cream);border:1px solid var(--line);border-bottom-right-radius:5px;}

  /* widget cards */
  .card{align-self:center;width:100%;background:linear-gradient(180deg,rgba(250,247,242,0.05),rgba(250,247,242,0.02));border:1px solid var(--line);border-radius:18px;padding:14px 16px;animation:rise .45s ease both;}
  .card.weigh{display:flex;align-items:center;gap:14px;}
  .card .big{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--cream);line-height:1;}
  .card .sub{font-size:11px;color:var(--muted);margin-top:4px;}
  .card .down{color:var(--gold-soft);font-weight:600;}
  .spark{flex:1;}
  .badge{text-align:center;}
  .badge .ring{width:78px;height:78px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 34%, rgba(227,201,136,0.25), rgba(201,169,97,0.08) 70%);border:2px solid var(--gold);
    font-family:'Fraunces',serif;font-weight:600;color:var(--gold-soft);font-size:22px;box-shadow:0 0 24px rgba(201,169,97,0.35);}
  .badge .cap{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;}

  .bar{display:flex;align-items:center;gap:10px;background:rgba(250,247,242,0.06);border:1px solid var(--line);border-radius:999px;padding:7px 7px 7px 16px;margin-top:8px;}
  .bar input{flex:1;background:transparent;border:none;outline:none;color:var(--cream);font-size:13.5px;font-family:'Inter';}
  .bar input::placeholder{color:var(--muted);}
  .mic{width:38px;height:38px;border:none;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 38% 34%,var(--gold-soft),var(--gold) 70%);display:flex;align-items:center;justify-content:center;}
  .mic svg{width:16px;height:16px;}

  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.orb-mini{animation:none;}.msg,.card{animation:none;}}
</style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div class="phone">
    <div class="notch"></div>
    <div class="head">
      <div class="orb-mini"></div>
      <div><div class="who">RIVEN</div><div class="ctx" id="ctx">Today</div></div>
    </div>
    <div class="thread" id="thread"></div>
    <div class="bar">
      <input type="text" placeholder="Talk to RIVEN…" aria-label="Talk to RIVEN"/>
      <button class="mic" aria-label="Send"><svg viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="#161513"/><path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke="#161513" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>

<script>
  const sparkline=`<svg class="spark" viewBox="0 0 120 40" preserveAspectRatio="none" height="40">
    <polyline points="0,8 24,12 48,10 72,20 96,24 120,30" fill="none" stroke="#C9A961" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="30" r="3.5" fill="#E3C988"/></svg>`;

  const scenarios={
    "Everyday":{ctx:"Today · just talk to it",msgs:[
      {r:1,t:"Morning. What'd you have for breakfast?"},
      {y:1,t:"Two eggs, turkey sausage, and coffee"},
      {r:1,t:'That\'s <span class="accent">32g protein</span> before 9am. Exactly how we like to start — your cravings won\'t stand a chance today.'},
      {y:1,t:"Had a chicken plate for lunch too"},
      {r:1,t:'Logged. You\'re at <span class="accent">68g</span> — over halfway, and it\'s only noon. Steady wins.'}
    ]},
    "Weigh-in":{ctx:"Daily weigh-in",msgs:[
      {r:1,t:"Morning. Step on the scale when you're ready — same time, before you eat."},
      {y:1,t:"216.1"},
      {card:"weigh"},
      {r:1,t:'Up a pound from yesterday — and that\'s <span class="accent">normal</span>. You had greens with salt last night; that\'s water, not fat. Your Sunday-to-Sunday is still <span class="accent">down 1.4</span>. That\'s the number that matters.'}
    ]},
    "Milestone":{ctx:"You hit a milestone",msgs:[
      {card:"badge"},
      {r:1,t:"Stop what you're doing. You just crossed 10 pounds down."},
      {r:1,t:'No crash diet. No giving up Sunday dinner. You did it eating <span class="accent">real food, steady</span> — and that\'s the kind that stays gone.'},
      {y:1,t:"I really did that 😭"},
      {r:1,t:'You really did. Next stop\'s 15 — same pace, no rush. 🌹'}
    ]},
    "Out to eat":{ctx:"Out to eat",msgs:[
      {y:1,t:"I'm at a restaurant with my sisters. Help 😅"},
      {r:1,t:"Breathe — you can eat out and stay right. What's on the menu?"},
      {y:1,t:"Catfish, mac & cheese, greens, cornbread"},
      {r:1,t:'Get the <span class="accent">catfish</span> — that\'s your protein anchor — and the greens. A little mac, split or skip the cornbread. Eat the fish and greens first and you\'ll be full before the heavy stuff. Now go enjoy your sisters.'}
    ]},
    "Check-in":{ctx:"Afternoon check-in",msgs:[
      {r:1,t:'Quick check-in 👋 You\'re at <span class="accent">64g protein</span> with dinner still to come. One solid plate tonight and you\'re right at goal.'},
      {y:1,t:"Making salmon tonight"},
      {r:1,t:'Perfect — that puts you right at <span class="accent">120g</span>. And you didn\'t have to count a thing. That\'s the whole point. Steady wins.'}
    ]}
  };

  const thread=document.getElementById('thread'), ctx=document.getElementById('ctx'), tabsEl=document.getElementById('tabs');

  function widget(kind){
    if(kind==="weigh") return `<div class="card weigh">
      <div><div class="big">214.2<span style="font-size:14px;color:var(--muted)"> lb</span></div><div class="sub">This Sunday · <span class="down">▼ 1.4 since last Sunday</span></div></div>
      ${sparkline}</div>`;
    if(kind==="badge") return `<div class="card badge"><div class="ring">10<span style="font-size:11px">lb</span></div><div class="cap">Down &amp; gone</div></div>`;
    return "";
  }

  function render(name){
    const s=scenarios[name]; ctx.textContent=s.ctx; thread.innerHTML="";
    s.msgs.forEach((m,i)=>{
      let el;
      if(m.card){ el=document.createElement('div'); el.innerHTML=widget(m.card); el=el.firstElementChild; }
      else{
        el=document.createElement('div');
        el.className='msg '+(m.r?'riven':'you');
        el.innerHTML=(m.r?'<div class="dot"></div>':'')+'<div class="bubble">'+m.t+'</div>';
      }
      el.style.animationDelay=(i*0.07)+'s';
      thread.appendChild(el);
    });
  }

  Object.keys(scenarios).forEach((name,i)=>{
    const b=document.createElement('button'); b.className='tab'+(i===0?' active':''); b.textContent=name;
    b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');render(name);};
    tabsEl.appendChild(b);
  });
  render("Everyday");
</script>
</body>
</html>
